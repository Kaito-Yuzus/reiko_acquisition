<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Files Reports</title>
</head>
<body>
    <header>
        <h1>Counting Numbers</h1>
    </header>

    <main>
        {% for location in locations%}
        <p><a href="{{ url_for('run_script') }}?file={{ location | urlencode }}" target="_blank">{{ location }}</a></p>
        {% endfor %}
        
    </main>

    <footer>
        <p>&copy; {{ year }}</p>
    </footer>
</body>
</html>
